services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - .:/workspace
      - ./volumes/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_FLASH_ATTENTION=1 # Flash Attention 有効化（長文の高速化とVRAM削減）
      - OLLAMA_KV_CACHE_TYPE=q8_0 # KVキャッシュを8bit量子化（VRAM消費を約半減、精度劣化は極小）
      - OLLAMA_NUM_PARALLEL=1 #並列推論を無効化（VRAM節約、推論安定）
      - OLLAMA_MAX_LOADED_MODELS=1 # 単一モデル・単一並列に限定してVRAMをこのモデルに全振りする
      - OLLAMA_KEEP_ALIVE=30m
    tty: true
    stdin_open: true
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # ← NVIDIAドライバーを明示
              count: all # ← "gpus all" に相当。すべてのGPUを割り当て
              capabilities: [ gpu ]
    restart: always
    networks:
      - ollama-network

  openwebui:
    image: openwebui/open-webui:latest-cuda
    container_name: openwebui
    ports:
      - "8081:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./volumes/openwebui_data:/app/backend/data
    restart: always
    networks:
      - ollama-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    depends_on:
      ollama:
        condition: service_healthy

  open_notebook:
    image: lfnovo/open_notebook:v1-latest-single
    ports:
      - "8502:8502"
      - "5055:5055"
      - "8000:8000"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=onote
      - OLLAMA_API_BASE=http://ollama:11434
      # API Server connection
      - API_URL=http://localhost:5055
      # Database connection (required)
      - SURREAL_URL=ws://localhost:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=production
    volumes:
      - ./volumes/notebook_data:/app/data
      - ./volumes/surreal_single_data:/mydata
    restart: always
    networks:
      - ollama-network
    depends_on:
      ollama:
        condition: service_healthy

  cliagent:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - ./opencode.json:/home/ubuntu/.config/opencode/opencode.json
      # 必要に応じてホスト側の解析対象ディレクトリをマウント
      # - /path/to/your/code:/code
    working_dir: /workspace
    network_mode: "host"
    tty: true
    stdin_open: true

networks:
  ollama-network:
    driver: bridge
